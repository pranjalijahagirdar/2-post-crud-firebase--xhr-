<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>post crud(xhr, firebase)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">

<body>
    <h1>2.XHR post crud (firebase)</h1>
    <div class="container-fluid mt-5">
        <div class="row">
            <div class="col-md-4 offset-3 mb-3">
                <div class="card">
                    <div class="card-body">
                        <form id="postForm">
                            <div class="form-group">
                                <label for="titleControl">Title</label>
                                <input class="form-control" type="text" id="titleControl">
                            </div>
                            <div class="form-group">
                                <label for="bodyControl">Body</label>
                                <textarea class="form-control" id="bodyControl" rows="4"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="userIdControl">User Id</label>
                                <select class="form-control" id="userIdControl">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-sm btn-block btn-info" id="addpostBtn">Add Post</button>
                            <button type="button" class="btn btn-sm btn-block btn-warning d-none" id="updatepostBtn">Update Post</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row" id="postList">

                        <button class="btn btn-sm text-danger" role="button">Delete</button>
                    </div>
                </div>
            </div> -->

        </div>
    </div>

        <div class="spinner-border text-primary" role="status">
  <span class="sr-only">Loading...</span>
</div>

    </div>
